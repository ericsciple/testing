name: Reusable OIDC Dump

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  dump-oidc-token:
    runs-on: ubuntu-latest
    steps:
      - name: Get OIDC Token
        id: get-token
        run: |
          OIDC_TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          echo "Token retrieved successfully"
          echo "::add-mask::$OIDC_TOKEN"
          echo "oidc_token=$OIDC_TOKEN" >> $GITHUB_OUTPUT
      
      - name: Decode and Print OIDC Token
        run: |
          echo "=== OIDC Token (masked) ==="
          echo "${{ steps.get-token.outputs.oidc_token }}"
          echo ""
          echo "=== Decoded Token Header ==="
          echo "${{ steps.get-token.outputs.oidc_token }}" | cut -d'.' -f1 | base64 -d 2>/dev/null | jq . || echo "Failed to decode header"
          echo ""
          echo "=== Decoded Token Payload ==="
          echo "${{ steps.get-token.outputs.oidc_token }}" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq . || echo "Failed to decode payload"
